name: Terraform Drift Detection

on:
  schedule:
    # Nightly at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# TODO: Think about matrix strategy if we want to run drift checks on multiple environments in parallel. 
# For now, we'll just run them sequentially in the same workflow.
jobs:
  drift-staging:
    name: Drift check (staging)
    runs-on: ubuntu-latest
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        run: terraform -chdir=infra/envs/staging init -input=false

      - name: terraform plan (drift)
        id: plan
        run: |
          terraform -chdir=infra/envs/staging plan -detailed-exitcode -input=false -no-color 2>&1 | tee /tmp/drift-staging.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Open drift issue if changes detected
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        env:
          DRIFT_ENV: staging
          DRIFT_PLAN_FILE: /tmp/drift-staging.txt
        with:
          script: |
            const openDriftIssue = require('./.github/scripts/open-drift-issue.js')
            await openDriftIssue({ github, context })

      - name: Fail if terraform errored (exitcode 1)
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  drift-production:
    name: Drift check (production)
    if: false  # TODO: re-enable once production org/workspace config is verified
    runs-on: ubuntu-latest
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        run: terraform -chdir=infra/envs/production init -input=false

      - name: terraform plan (drift)
        id: plan
        run: |
          terraform -chdir=infra/envs/production plan -detailed-exitcode -input=false -no-color 2>&1 | tee /tmp/drift-production.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Open drift issue if changes detected
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        env:
          DRIFT_ENV: production
          DRIFT_PLAN_FILE: /tmp/drift-production.txt
        with:
          script: |
            const openDriftIssue = require('./.github/scripts/open-drift-issue.js')
            await openDriftIssue({ github, context })

      - name: Fail if terraform errored (exitcode 1)
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
