name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  plan-staging:
    name: Plan (staging)
    runs-on: ubuntu-latest
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        run: terraform -chdir=infra/envs/staging init -input=false

      - name: terraform validate
        run: terraform -chdir=infra/envs/staging validate

      - name: terraform plan
        id: plan
        run: terraform -chdir=infra/envs/staging plan -input=false -no-color 2>&1 | tee /tmp/plan-staging.txt
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        env:
          PLAN_ENV: staging
          PLAN_FILE: /tmp/plan-staging.txt
        with:
          script: |
            const postPlanComment = require('./.github/scripts/post-plan-comment.js')
            await postPlanComment({ github, context })

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  plan-production:
    name: Plan (production)
    if: false  # TODO: re-enable once production org/workspace config is verified
    runs-on: ubuntu-latest
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: terraform init
        run: terraform -chdir=infra/envs/production init -input=false

      - name: terraform validate
        run: terraform -chdir=infra/envs/production validate

      - name: terraform plan
        id: plan
        run: terraform -chdir=infra/envs/production plan -input=false -no-color 2>&1 | tee /tmp/plan-production.txt
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        env:
          PLAN_ENV: production
          PLAN_FILE: /tmp/plan-production.txt
        with:
          script: |
            const postPlanComment = require('./.github/scripts/post-plan-comment.js')
            await postPlanComment({ github, context })

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
