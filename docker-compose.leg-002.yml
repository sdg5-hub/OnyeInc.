services:
  postgres-leg-002:
    image: postgres:16-alpine
    ports:
      - "54329:5432"
    environment:
      POSTGRES_DB: onye_leg002
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d onye_leg002"]
      interval: 1s
      timeout: 5s
      retries: 30
